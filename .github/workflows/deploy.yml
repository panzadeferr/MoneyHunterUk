name: Test & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions at workflow level — required for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── JOB 1: RUN ALL TESTS ──────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── TEST 1: JS Syntax Check ──
      - name: JS Syntax Check (app.html)
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('app.html')) { console.log('⏭️ app.html not found, skipping'); process.exit(0); }
            const html = fs.readFileSync('app.html', 'utf8');
            const m = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!m) { console.log('⏭️ No inline script found'); process.exit(0); }
            try { new Function(m[1]); console.log('✅ app.html JS syntax OK'); }
            catch(e) { console.log('❌ JS SYNTAX ERROR:', e.message); process.exit(1); }
          "
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('app.html')) process.exit(0);
            const html = fs.readFileSync('app.html', 'utf8');
            const forbidden = ['YOUR_BREVO_API_KEY', 'RAILWAY_URL_HERE', 'xkeysib-'];
            let ok = true;
            forbidden.forEach(s => { if (html.includes(s)) { console.log('❌ Forbidden string found:', s); ok = false; } });
            if (!ok) process.exit(1);
            console.log('✅ No forbidden strings found');
          "
          if [ -f "syntax-check.mjs" ]; then
            node syntax-check.mjs
          else
            echo "⚠️ syntax-check.mjs not found, using inline checks only"
          fi

      # ── TEST 2: Check required files exist ──
      - name: Check required files exist
        run: |
          echo "Checking required files..."
          for file in index.html app.html sw.js manifest.json; do
            if [ ! -f "$file" ]; then
              echo "❌ MISSING: $file"
              exit 1
            else
              echo "✅ Found: $file"
            fi
          done
          echo "✅ All required files present."

      # ── TEST 3: Check no exposed secrets ──
      - name: Check no exposed secrets
        run: |
          echo "Scanning for exposed secrets..."
          FAILED=0
          # Only flag actually dangerous secrets
          if grep -r "xkeysib-" index.html app.html 2>/dev/null; then
            echo "❌ EXPOSED BREVO API KEY found!"
            FAILED=1
          fi
          if grep -rE "[0-9]{8,10}:AA[a-zA-Z0-9_-]{33}" app.html 2>/dev/null; then
            echo "❌ EXPOSED TELEGRAM TOKEN found!"
            FAILED=1
          fi
          if grep -r "sb_secret_" app.html 2>/dev/null; then
            echo "❌ EXPOSED SUPABASE SECRET KEY found!"
            FAILED=1
          fi
          # sb_publishable_ is SAFE — designed to be public
          if [ $FAILED -eq 1 ]; then
            exit 1
          fi
          echo "✅ No dangerous secrets found."

      # ── TEST 4: Validate manifest.json ──
      - name: Validate manifest.json
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('manifest.json','utf8'));
            ['name','short_name','start_url','display','icons'].forEach(k => {
              if (!m[k]) { console.log('❌ Missing:', k); process.exit(1); }
              console.log('✅', k);
            });
            console.log('✅ manifest.json valid');
          "

      # ── TEST 5: Data and page checks (amounts, expiry, disclosure) ──
      - name: Data checks
        run: python3 tests/check_data.py

      - name: All tests passed
        run: echo "✅ All checks passed — deploying..."

  # ── JOB 2: DEPLOY TO GITHUB PAGES ────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      # Publish only the files the site needs, not the scraper, notes or internal documents
      - name: Build site folder
        run: |
          python3 scripts/make_sitemap.py
          mkdir _site
          cp index.html app.html bank-switch.html privacy.html sw.js manifest.json all_deals.json robots.txt sitemap.xml feed.xml CNAME _site/
          cp *.png googlecc*.html _site/
          cp UK-rewards-stacking-toolkit.xlsx _site/
          mkdir -p _site/data
          [ -d data ] && cp -r data/. _site/data/ || true

      - name: Upload site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployed
        run: echo "✅ Live at ${{ steps.deployment.outputs.page_url }}"
        
