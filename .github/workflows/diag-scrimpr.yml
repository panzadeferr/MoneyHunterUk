name: Diag Scrimpr HTML (temporary)
on:
  push:
    branches: [diag/scrimpr-html]
    paths: ['.github/workflows/diag-scrimpr.yml']
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p diag
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          for p in free-money-offers-uk gift-card-cashback terms; do
            curl -sS -L -A "$UA" -o diag/$p.html -w "$p %{http_code} %{size_download}\n" https://scrimpr.co.uk/$p/ >> diag/status.txt || echo "$p failed" >> diag/status.txt
          done
          cat diag/status.txt
          git config user.name "diag-bot"; git config user.email "diag@users.noreply.github.com"
          git add diag; git commit -m "diag: scrimpr html"; git push
