<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Coinsworth: a money adventure | Money Hunters</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<div class="app">
  <div class="topbar" id="topbar" hidden>
    <span class="who" id="tWho">LV 1</span>
    <div class="hpwrap"><div class="bar"><i id="tHp"></i></div><div class="bar xp"><i id="tXp"></i></div></div>
    <span>&#9702; <b id="tCoins">0</b></span>
    <button class="icon" id="mute" aria-label="Toggle sound">&#9834;</button>
  </div>
  <div class="screen">
    <canvas id="cv" width="240" height="208" aria-label="Game screen"></canvas>
    <div class="banner" id="banner" hidden></div>
    <div class="dialog" id="dialog" hidden role="dialog"><div class="spk" id="spk"></div><p id="dtext"></p><div class="choices" id="choices"></div><span class="more" id="more">&#9660;</span></div>
  </div>
  <div class="controls" id="controls" hidden>
    <div class="pad" aria-label="Move">
      <span></span><button data-d="0" aria-label="Up">&#9650;</button><span></span>
      <button data-d="3" aria-label="Left">&#9664;</button><span></span><button data-d="1" aria-label="Right">&#9654;</button>
      <span></span><button data-d="2" aria-label="Down">&#9660;</button><span></span>
    </div>
    <div class="rightctl"><button class="abtn" id="abtn" aria-label="A: talk, read, open">A</button><button class="menubtn" id="menubtn">MENU</button></div>
  </div>
  <div class="bpanel" id="bpanel"></div>
  <p class="small" style="text-align:center">Some links on Money Hunters pay us. They never affect the game.</p>
</div>
<div class="overlay" id="ov" hidden><div class="box" id="box" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/save.js"></script>
<script src="js/battle.js"></script>
<script src="js/main.js"></script>
</body>
</html>
